[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["var-annotated", "call-arg", "arg-type", "import-not-found", "import-untyped"]
exclude = [
    "backend/venv/",
    "venv/",
    "__pycache__/"
]