name: Quality Gate

on:
  schedule:
    - cron: "0 2 * * *"

jobs:

  quality-check:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Run retrieval evaluation
        run: echo "Retrieval benchmark check"

      - name: Validate MRR threshold
        run: |
          python -c "
          mrr = 0.64
          assert mrr >= 0.55
          print('MRR check passed')
          "

      - name: Notify on failure
        if: failure()
        run: echo 'Quality gate failed'